name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; see [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: TrustWeave version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: JDK, OS, Kotlin and Gradle versions
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or failing test is ideal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Remove secrets, keys and personal data first.
      render: text
