name: Feature request
description: Propose an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include the module(s) and any spec (W3C, ETSI, OpenID) this relates to.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
