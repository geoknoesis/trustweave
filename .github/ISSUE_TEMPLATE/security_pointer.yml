name: Security vulnerability (read first)
description: Do not file vulnerabilities as public issues
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        **Do not describe a vulnerability in a public issue.** Follow [SECURITY.md](../blob/main/SECURITY.md)
        and email security@geoknoesis.com. Use this form only for non-sensitive security hardening
        suggestions (no exploit details).
  - type: textarea
    id: suggestion
    attributes:
      label: Hardening suggestion (no exploit details)
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is not a vulnerability report and contains no exploit or secret material.
          required: true
