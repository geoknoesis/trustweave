name: AWS KMS custody qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-kms-custody-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Identified key signing and replacement recovery
    runs-on: ubuntu-latest
    environment: aws-kms-qualification
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_KMS_QUALIFICATION_REGION }}
      TRUSTWEAVE_AWS_KMS_PRIMARY_KEY_ARN: ${{ vars.AWS_KMS_PRIMARY_KEY_ARN }}
      TRUSTWEAVE_AWS_KMS_REPLACEMENT_KEY_ARN: ${{ vars.AWS_KMS_REPLACEMENT_KEY_ARN }}
      TRUSTWEAVE_AWS_KMS_DENIED_KEY_ARN: ${{ vars.AWS_KMS_DENIED_KEY_ARN }}
      TRUSTWEAVE_LIVE_CUSTODY: "true"
    steps:
      - name: Validate identified qualification resources
        env:
          QUALIFICATION_ROLE_ARN: ${{ vars.AWS_KMS_QUALIFICATION_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in QUALIFICATION_ROLE_ARN AWS_REGION TRUSTWEAVE_AWS_KMS_PRIMARY_KEY_ARN TRUSTWEAVE_AWS_KMS_REPLACEMENT_KEY_ARN TRUSTWEAVE_AWS_KMS_DENIED_KEY_ARN; do
            test -n "${!name:-}" || { echo "Required aws-kms-qualification variable $name is missing" >&2; exit 1; }
          done
          test "$TRUSTWEAVE_AWS_KMS_PRIMARY_KEY_ARN" != "$TRUSTWEAVE_AWS_KMS_REPLACEMENT_KEY_ARN"
          test "$TRUSTWEAVE_AWS_KMS_PRIMARY_KEY_ARN" != "$TRUSTWEAVE_AWS_KMS_DENIED_KEY_ARN"
          test "$TRUSTWEAVE_AWS_KMS_REPLACEMENT_KEY_ARN" != "$TRUSTWEAVE_AWS_KMS_DENIED_KEY_ARN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Obtain short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_KMS_QUALIFICATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_KMS_QUALIFICATION_REGION }}
          role-session-name: trustweave-custody-${{ github.run_id }}

      - name: Run live read-only custody qualification
        run: >-
          ./gradlew :kms:plugins:aws:test
          --tests 'org.trustweave.awskms.AwsKmsLiveQualificationTest'
          -Dtrustweave.custody.evidenceDir=${{ github.workspace }}/build/qualification/aws-kms
          --rerun-tasks --no-build-cache --no-daemon --stacktrace

      - name: Validate commit-bound sanitized evidence
        run: >-
          python scripts/check-custody-evidence.py
          build/qualification/aws-kms/aws-kms-custody.json
          --expected-commit "${GITHUB_SHA}"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-kms-custody-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/qualification/aws-kms/aws-kms-custody.json
            build/kms/plugins/aws/test-results/test/**
          if-no-files-found: error
          retention-days: 90
