name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TRUSTWEAVE_INDY_INTEGRATION: required

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-wallet:
    name: Reference wallet contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reference-wallet/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
  android-wallet:
    name: Android app tests and shared compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-wallet/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK components
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"'
      - name: Compile Android and run app unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:compileKotlinJvm --max-workers=2 --no-daemon
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Check generated capability documentation
        run: python scripts/generate-capability-docs.py --check

      - name: Lint with ktlint
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify API compatibility
        run: ./gradlew checkKotlinAbi --no-daemon --stacktrace

      - name: Generate merged coverage
        run: ./gradlew koverXmlReport koverHtmlReport --no-daemon --stacktrace

      - name: Generate dependency inventory
        run: ./gradlew cyclonedxBom --no-daemon --stacktrace

      - name: Upload coverage and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-validation
          path: |
            build/reports/kover/
            build/reports/cyclonedx/
            build/**/test-results/
            build/**/reports/cyclonedx*/
          if-no-files-found: warn
