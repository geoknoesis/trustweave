name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-wallet:
    name: Reference wallet contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reference-wallet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reference-wallet/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
  android-wallet:
    name: Android app tests and shared compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: reference-wallet/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # JDK 17 on purpose: the Android Gradle Plugin and the app/shared modules in
          # reference-wallet/android compile to Java/JVM 17 (see sourceCompatibility and jvmTarget
          # in their build files). The SDK jobs below use JDK 21, the toolchain of the main build.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Install Android SDK components
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"'
      - name: Compile Android and run app unit tests
        run: ./gradlew :app:testDebugUnitTest :shared:jvmTest --max-workers=2 --no-daemon
  # ---------------------------------------------------------------------------------------------
  # SDK checks. Formerly one serial job; now independent jobs that run in parallel. Each sets up
  # Gradle with the same pinned action, so dependency and build caches are shared between them.
  # ---------------------------------------------------------------------------------------------
  contracts:
    name: Validation tools and documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test validation tools and documentation contracts
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check-documentation.py --report build/reports/documentation.json
          python scripts/generate-capability-docs.py --check
          python scripts/check-workflow-pinning.py
          python scripts/check-dependency-catalog.py
          python scripts/check-publication.py
          python scripts/check-capability-coverage.py
          python scripts/check-container-images.py
          python scripts/check-cancellation-guards.py
          python scripts/check-telemetry-operations.py
          python scripts/check-workflow-evidence-paths.py

      - name: Upload documentation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-contracts
          path: build/reports/documentation.json
          if-no-files-found: warn

  lint:
    name: Lint and API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Lint with ktlint
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: Verify API compatibility
        run: ./gradlew checkKotlinAbi --no-daemon --stacktrace

  build:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # NOTE: inert today. TRUSTWEAVE_INDY_INTEGRATION is read only by the separate
    # `:anchors:plugins:indy:integrationTest` task (a Testcontainers VON ledger, needs Docker, which
    # ubuntu-latest has). `./gradlew build` does not depend on that task, so this job produces no
    # live-ledger evidence and the "required" value never fails anything. It is kept (not removed)
    # so the day the task is wired into `check` or run as a step, it fails instead of skipping.
    # No gate is weakened by this comment; the live round trip simply is not part of CI yet.
    env:
      TRUSTWEAVE_INDY_INTEGRATION: required
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Configure isolated PKCS11 qualification token
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends softhsm2
          test -f /usr/lib/softhsm/libsofthsm2.so
          echo "SOFTHSM2_LIB=/usr/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/trustweave-softhsm2.conf" >> "$GITHUB_ENV"

      # ktlint and the ABI check run in the `lint` job; excluding them here avoids doing them twice.
      - name: Build with Gradle
        run: ./gradlew build -x ktlintCheck -x checkKotlinAbi --no-daemon --stacktrace

      - name: Reject undiscoverable tests and verify required regression evidence
        run: |
          python scripts/check-junit-contract.py --report build/reports/junit-contract.json
          python scripts/check-test-evidence.py --report build/reports/test-evidence.json
          python scripts/check-reliability-evidence.py

      - name: Generate merged coverage
        run: ./gradlew koverXmlReport koverHtmlReport --no-daemon --stacktrace

      - name: Enforce coverage policy
        run: |
          python -m unittest discover -s scripts -p test_check_coverage_policy.py
          python scripts/check-coverage-policy.py

      - name: Bind validation to the candidate commit
        run: python scripts/record-validation-manifest.py

      - name: Upload coverage and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-validation
          include-hidden-files: true
          path: |
            build/reports/validation-manifest.json
            build/credentials/plugins/verifiable-intent/qualification/intent-operations.json
            build/credentials/plugins/verifiable-intent/qualification/reliability/
            build/credentials/plugins/status-list/server/qualification/status-list-diagnostics.log
            build/reports/junit-contract.json
            build/reports/test-evidence.json
            build/reports/kover/
            build/**/test-results/
          if-no-files-found: warn

  documentation-examples:
    name: Compiled documentation entry points
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Execute compiled documentation entry points
        run: |
          mkdir -p build/reports
          set -o pipefail
          ./gradlew :distribution:examples:checkDocumentationExamples --no-daemon --stacktrace | tee build/reports/documentation-execution.log

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-execution
          path: build/reports/documentation-execution.log
          if-no-files-found: warn

  verifiable-intent:
    name: Verifiable Intent interoperability and operations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Checkout pinned VI interoperability reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-intent/verifiable-intent
          ref: 356c29635f1c44df7de02edb58699ca9f29bece6
          path: .gradle/vi-reference
          persist-credentials: false

      # --rerun-tasks/--no-build-cache are intentional: the qualification files are evidence and
      # must be regenerated by this run, never restored from a historical cache entry
      # (scripts/test_workflow_evidence_paths.py enforces this).
      - name: Verify Kotlin tokens with the Python reference
        run: |
          rm -rf build/credentials/plugins/verifiable-intent/qualification
          ./gradlew :credentials:plugins:verifiable-intent:test --rerun-tasks --no-build-cache --no-daemon
          python3 -m venv .gradle/vi-python
          .gradle/vi-python/bin/python -m pip install cryptography==46.0.3 pytest==9.0.2
          PYTHONPATH="${PWD}/.gradle/vi-reference/src" .gradle/vi-python/bin/python -m pytest .gradle/vi-reference/tests -q --junitxml=.gradle/vi-reference-results.xml
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file build/credentials/plugins/verifiable-intent/qualification/vi-kotlin-immediate.json > .gradle/vi-immediate-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file build/credentials/plugins/verifiable-intent/qualification/vi-kotlin-autonomous.json > .gradle/vi-autonomous-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file build/credentials/plugins/verifiable-intent/qualification/vi-kotlin-checkout.json > .gradle/vi-checkout-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file credentials/plugins/verifiable-intent/src/test/resources/vi_python_cross_stack.json > .gradle/vi-python-immediate-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file credentials/plugins/verifiable-intent/src/test/resources/vi_python_autonomous.json > .gradle/vi-python-autonomous-results.json
          python scripts/vi-stateful-model.py --check --file credentials/plugins/verifiable-intent/src/test/resources/vi_stateful_model.json
          python scripts/check-vi-matrix.py

      - name: Validate intent host alert rules
        run: >-
          docker run --rm --network none --entrypoint promtool
          --mount "type=bind,source=${PWD}/docs/operations/intent,target=/work,readonly"
          --workdir /work prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml

      - name: Validate runtime ledger metric exposition
        run: >-
          docker run --rm -i --network none --entrypoint promtool
          prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check metrics
          < build/credentials/plugins/verifiable-intent/qualification/intent-metrics.prom

      - name: Exercise intent notification delivery and recovery
        timeout-minutes: 15
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts -p test_intent_notification_exercise.py
          python scripts/intent-notification-exercise.py

      - name: Upload interoperability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vi-validation
          include-hidden-files: true
          path: |
            .gradle/vi-reference-results.xml
            .gradle/vi-immediate-results.json
            .gradle/vi-autonomous-results.json
            .gradle/vi-checkout-results.json
            .gradle/vi-python-immediate-results.json
            .gradle/vi-python-autonomous-results.json
            build/reports/vi-matrix.json
            build/credentials/plugins/verifiable-intent/qualification/intent-operations.json
            build/credentials/plugins/verifiable-intent/qualification/reliability/
            build/credentials/plugins/verifiable-intent/qualification/intent-metrics.prom
            build/reports/intent-notifications/
          if-no-files-found: warn

  host-observability:
    name: Shared host coverage and telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # --rerun-tasks/--no-build-cache are intentional: host-metrics.prom and the coverage report
      # are evidence and must come from this run (scripts/test_workflow_evidence_paths.py).
      - name: Enforce shared host coverage floors
        run: |
          ./gradlew :observability:test :observability:koverXmlReport --rerun-tasks --no-build-cache --no-daemon
          python scripts/check-coverage-policy.py build/observability/reports/kover/report.xml --policy config/host-coverage-policy.json

      - name: Validate shared host alert rules and metric exposition
        run: |
          docker run --rm --network none --entrypoint promtool --mount "type=bind,source=${PWD}/docs/operations/host,target=/work,readonly" --workdir /work prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
          docker run --rm -i --network none --entrypoint promtool prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check metrics < build/observability/qualification/host-metrics.prom

      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-observability
          path: |
            build/observability/reports/
            build/observability/qualification/
          if-no-files-found: warn

  sbom:
    name: Dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Generate dependency inventory
        run: ./gradlew cyclonedxBom --no-daemon --stacktrace

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            build/reports/cyclonedx/
            build/**/reports/cyclonedx*/
          if-no-files-found: warn
