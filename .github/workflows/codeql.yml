name: CodeQL

# Static analysis of the security-critical core, not all 107 modules: CodeQL must observe the
# Kotlin compiler (in-process, no daemon, no build cache), which makes a full build far slower than
# CI's. The subset below covers the SPIs and the code that parses untrusted input — DID resolution
# and documents, key management, credential issuance/verification, presentation exchange (OIDC4VP,
# OIDC4VCI), DIDComm, ETSI signature validation, the trust registry and the facade. Extend the list
# when a new module handles untrusted input.
#
# Runs on main and weekly rather than on every PR to keep PR feedback fast; findings appear in the
# repository's code scanning alerts.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Restoring compiled classes would hide them from the CodeQL tracer.
          cache-read-only: true

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compile the analysed modules under the CodeQL tracer
        run: >-
          ./gradlew --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.incremental=false
          :common:compileKotlin
          :did:did-core:compileKotlin
          :did:plugins:web:compileKotlin
          :kms:kms-core:compileKotlin
          :wallet:wallet-core:compileKotlin
          :credentials:credential-api:compileKotlin
          :credentials:plugins:oidc4vp:compileKotlin
          :credentials:plugins:oidc4vci:compileKotlin
          :credentials:plugins:didcomm:compileKotlin
          :signatures:etsi-validation:compileKotlin
          :trust-registry:trust-registry-core:compileKotlin
          :trust:compileKotlin

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
