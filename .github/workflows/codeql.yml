name: CodeQL

# Static analysis of the security-critical core, not all 107 modules: CodeQL must observe the
# Kotlin compiler (in-process, no daemon, no build cache), which makes a full build far slower than
# CI's. The subset below covers the SPIs and the code that parses untrusted input — DID resolution
# and documents, key management, credential issuance/verification, presentation exchange (OIDC4VP,
# OIDC4VCI), DIDComm, ETSI signature validation, the trust registry and the facade. Extend the list
# when a new module handles untrusted input.
#
# Runs on main, weekly, and on same-repository pull requests that touch the analysed modules (paths
# filter below) so a change to untrusted-input code is scanned before it merges. Unrelated PRs skip
# it to keep feedback fast. Fork PRs get a read-only token and cannot upload results, so they are
# skipped (as are Dependabot PRs, see the job); main and the weekly run still cover merged fork contributions. Keep the paths filter in
# step with the module list in the compile step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'common/**'
      - 'did/did-core/**'
      - 'did/plugins/web/**'
      - 'kms/kms-core/**'
      - 'wallet/wallet-core/**'
      - 'credentials/credential-api/**'
      - 'credentials/plugins/oidc4vp/**'
      - 'credentials/plugins/oidc4vci/**'
      - 'credentials/plugins/didcomm/**'
      - 'signatures/etsi-validation/**'
      - 'trust-registry/trust-registry-core/**'
      - 'trust/**'
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # Dependabot-triggered runs get a read-only GITHUB_TOKEN, so the SARIF upload (security-events:
    # write) would fail on every Dependabot PR; they are skipped like fork PRs. The weekly and main
    # runs scan the merged result.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Restoring compiled classes would hide them from the CodeQL tracer.
          cache-read-only: true

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compile the analysed modules under the CodeQL tracer
        run: >-
          ./gradlew --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.incremental=false
          :common:compileKotlin
          :did:did-core:compileKotlin
          :did:plugins:web:compileKotlin
          :kms:kms-core:compileKotlin
          :wallet:wallet-core:compileKotlin
          :credentials:credential-api:compileKotlin
          :credentials:plugins:oidc4vp:compileKotlin
          :credentials:plugins:oidc4vci:compileKotlin
          :credentials:plugins:didcomm:compileKotlin
          :signatures:etsi-validation:compileKotlin
          :trust-registry:trust-registry-core:compileKotlin
          :trust:compileKotlin

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
