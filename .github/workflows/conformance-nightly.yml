name: Conformance Tests (Nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Least privilege by default. The job that runs the build never holds a write
# scope; raising an issue is split into a separate job that runs no repository
# code, so a compromised dependency in the build cannot reach issues: write.
permissions:
  contents: read

jobs:
  conformance-full:
    name: Full Phase 1 Conformance Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run all conformance tests
        run: ./gradlew :distribution:conformance:conformanceTest
      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report-nightly-${{ github.run_number }}
          path: distribution/conformance/build/reports/conformance/
          retention-days: 90

  report-failure:
    name: Open issue on failure
    needs: conformance-full
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open issue on failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'conformance-failure', state: 'open'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Conformance suite failed on nightly run ${context.runNumber}`,
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['conformance-failure', 'bug']
              });
            }
