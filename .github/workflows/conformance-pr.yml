name: Conformance Tests (PR)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'credentials/credential-api/**'
      - 'credentials/plugins/presentation-exchange/**'
      - 'did/did-core/**'
      - 'did/plugins/key/**'
      - 'distribution/conformance/**'

permissions:
  contents: read

concurrency:
  group: conformance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Phase 1 Conformance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Run conformance tests
        run: ./gradlew :distribution:conformance:conformanceTest
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report-pr-${{ github.run_number }}
          path: distribution/conformance/build/reports/conformance/
