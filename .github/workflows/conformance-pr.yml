name: Conformance Tests (PR)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'credentials/credential-api/**'
      - 'credentials/plugins/presentation-exchange/**'
      - 'did/did-core/**'
      - 'did/plugins/key/**'
      - 'distribution/conformance/**'

permissions:
  contents: read

concurrency:
  group: conformance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Phase 1 Conformance Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run conformance tests
        run: ./gradlew :distribution:conformance:conformanceTest
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report-pr-${{ github.run_number }}
          path: distribution/conformance/build/reports/conformance/
