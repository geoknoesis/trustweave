name: Conformance Tests (PR)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'credentials/credential-api/**'
      - 'credentials/plugins/presentation-exchange/**'
      - 'did/did-core/**'
      - 'did/plugins/key/**'
      - 'distribution/conformance/**'

permissions:
  contents: read

concurrency:
  group: conformance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Phase 1 Conformance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run conformance tests
        run: ./gradlew :distribution:conformance:conformanceTest
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report-pr-${{ github.run_number }}
          path: distribution/conformance/build/reports/conformance/
