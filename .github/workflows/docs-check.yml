name: Documentation Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'reference-wallet/**/*.md'
      - 'distribution/examples/**'
      - 'scripts/check-doc*'
      - 'scripts/test_check_*.py'
      - 'scripts/check-junit-contract.py'
      - 'scripts/check-test-evidence.py'
      - 'config/testing-contract.json'
      - 'config/documentation-contract.json'
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/docs-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'reference-wallet/**/*.md'
      - 'distribution/examples/**'
      - 'scripts/check-doc*'
      - 'scripts/test_check_*.py'
      - 'scripts/check-junit-contract.py'
      - 'scripts/check-test-evidence.py'
      - 'config/testing-contract.json'
      - 'config/documentation-contract.json'
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Test the documentation checker
        run: python -m unittest discover -s scripts -p 'test_check_*.py'
      - name: Check maintained links, fences, API patterns and exact examples
        run: python scripts/check-documentation.py --report build/reports/documentation.json
      - name: Check generated capability documentation
        run: python scripts/generate-capability-docs.py --check
      - name: Run implemented local documentation examples
        run: ./gradlew :distribution:examples:checkDocumentationExamples :distribution:examples:test :distribution:examples:ktlintCheck --no-daemon
      - name: Execute fixture and host documentation contracts
        run: ./gradlew :testkit:test --tests '*DocumentationExampleTest' :observability:test --tests '*HostDocumentationExampleTest' --no-daemon
      - name: Execute critical integration documentation
        run: ./gradlew :credentials:plugins:verifiable-intent:test --tests '*CheckoutTrustTest' --tests '*LedgerMigrationDocumentationTest' :wallet:plugins:file:test --tests '*FileWalletFactoryTest' --no-daemon
      - name: Preserve documentation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-evidence
          path: |
            build/reports/documentation.json
            build/**/test-results/
          if-no-files-found: error
