name: Documentation Check

on:
  # Narrow on purpose: ci.yml (`contracts`, `documentation-examples`) already runs the script unit
  # tests, check-documentation and the documentation examples on every PR. This workflow adds the
  # slower Gradle documentation tests, and only when documentation or its executed sources change.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'reference-wallet/**/*.md'
      - 'distribution/examples/**'
      - 'scripts/check-doc*'
      - 'scripts/generate-capability-docs.py'
      - 'config/documentation-contract.json'
      # Only the Kotlin sources the documentation contract executes (config/documentation-contract.json);
      # a general **/*.kt filter ran this workflow on nearly every PR. Keep in step with that file.
      - 'testkit/src/test/kotlin/org/trustweave/testkit/DocumentationExampleTest.kt'
      - 'observability/src/test/kotlin/org/trustweave/observability/*DocumentationExampleTest.kt'
      - 'credentials/plugins/verifiable-intent/src/test/kotlin/org/trustweave/credential/vi/CheckoutTrustTest.kt'
      - 'credentials/plugins/verifiable-intent/src/test/kotlin/org/trustweave/credential/vi/LedgerMigrationDocumentationTest.kt'
      - 'wallet/plugins/file/src/test/kotlin/org/trustweave/wallet/file/FileWalletFactoryTest.kt'
      - '.github/workflows/docs-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'reference-wallet/**/*.md'
      - 'distribution/examples/**'
      - 'scripts/check-doc*'
      - 'scripts/generate-capability-docs.py'
      - 'config/documentation-contract.json'
      # Only the Kotlin sources the documentation contract executes (config/documentation-contract.json);
      # a general **/*.kt filter ran this workflow on nearly every PR. Keep in step with that file.
      - 'testkit/src/test/kotlin/org/trustweave/testkit/DocumentationExampleTest.kt'
      - 'observability/src/test/kotlin/org/trustweave/observability/*DocumentationExampleTest.kt'
      - 'credentials/plugins/verifiable-intent/src/test/kotlin/org/trustweave/credential/vi/CheckoutTrustTest.kt'
      - 'credentials/plugins/verifiable-intent/src/test/kotlin/org/trustweave/credential/vi/LedgerMigrationDocumentationTest.kt'
      - 'wallet/plugins/file/src/test/kotlin/org/trustweave/wallet/file/FileWalletFactoryTest.kt'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Check maintained links, fences, API patterns and exact examples
        run: python scripts/check-documentation.py --report build/reports/documentation.json
      - name: Check generated capability documentation
        run: python scripts/generate-capability-docs.py --check
      - name: Run implemented local documentation examples
        run: ./gradlew :distribution:examples:checkDocumentationExamples :distribution:examples:test :distribution:examples:ktlintCheck --no-daemon
      - name: Execute fixture and host documentation contracts
        run: ./gradlew :testkit:test --tests '*DocumentationExampleTest' :observability:test --tests '*HostDocumentationExampleTest' --no-daemon
      - name: Execute critical integration documentation
        run: ./gradlew :credentials:plugins:verifiable-intent:test --tests '*CheckoutTrustTest' --tests '*LedgerMigrationDocumentationTest' :wallet:plugins:file:test --tests '*FileWalletFactoryTest' --no-daemon
      - name: Preserve documentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-evidence
          path: |
            build/reports/documentation.json
            build/**/test-results/
          if-no-files-found: error
