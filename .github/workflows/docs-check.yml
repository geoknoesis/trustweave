name: Documentation Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'reference-wallet/**/*.md'
      - 'distribution/examples/**'
      - 'scripts/check-doc*'
      - 'scripts/test_check_documentation.py'
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/docs-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'reference-wallet/**/*.md'
      - 'distribution/examples/**'
      - 'scripts/check-doc*'
      - 'scripts/test_check_documentation.py'
      - '**/*.kt'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Test the documentation checker
        run: python -m unittest discover -s scripts -p test_check_documentation.py
      - name: Check maintained links, fences, API patterns and exact examples
        run: python scripts/check-documentation.py
      - name: Check generated capability documentation
        run: python scripts/generate-capability-docs.py --check
      - name: Run implemented local documentation examples
        run: ./gradlew :distribution:examples:checkDocumentationExamples :distribution:examples:test :distribution:examples:ktlintCheck --no-daemon
