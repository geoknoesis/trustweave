name: Release evidence

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release run in progress: a tag build is evidence and a half-cancelled run could leave
# a partial publish. Runs of the same ref queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the tag commit must be proven to be an ancestor of origin/main below.
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        # A tag can point at any commit, including one on an unreviewed branch. Only commits that reached
        # main (and so passed its review and branch protection) may be released. Runs before anything is built.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main; refusing to release it." >&2
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Configure isolated PKCS11 qualification token
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends softhsm2
          test -f /usr/lib/softhsm/libsofthsm2.so
          echo "SOFTHSM2_LIB=/usr/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/trustweave-softhsm2.conf" >> "$GITHUB_ENV"
      - name: Test validation tools and documentation contracts
        # The same script ci.yml runs (unit tests, documentation, publication, telemetry and workflow-path contracts).
        run: bash scripts/run-contract-checks.sh

      - name: Pre-pull digest-pinned test images
        # Testcontainers has a short pull timeout; a cold runner or a slow registry otherwise fails an
        # unrelated test with ContainerFetchException. Pull with retries so the cause is visible here.
        run: bash scripts/prepull-test-images.sh

      - name: Validate release and generate dependency inventories
        run: |
          ./gradlew build ktlintCheck checkKotlinAbi koverXmlReport cyclonedxBom --no-daemon --stacktrace
          python -m unittest discover -s scripts -p test_check_coverage_policy.py
          python scripts/check-coverage-policy.py
      - name: Execute compiled documentation entry points
        # pipefail: without it `tee` would mask a Gradle failure in the release gate.
        run: |
          set -o pipefail
          ./gradlew :distribution:examples:checkDocumentationExamples --no-daemon --stacktrace | tee build/reports/documentation-execution.log

      - name: Checkout pinned VI interoperability reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-intent/verifiable-intent
          ref: 356c29635f1c44df7de02edb58699ca9f29bece6
          path: .gradle/vi-reference
          persist-credentials: false

      - name: Verify Kotlin tokens with the Python reference
        run: |
          rm -rf build/credentials/plugins/verifiable-intent/qualification
          ./gradlew :credentials:plugins:verifiable-intent:test --rerun-tasks --no-build-cache --no-daemon
          python3 -m venv .gradle/vi-python
          .gradle/vi-python/bin/python -m pip install cryptography==46.0.3 pytest==9.0.2
          PYTHONPATH="${PWD}/.gradle/vi-reference/src" .gradle/vi-python/bin/python -m pytest .gradle/vi-reference/tests -q --junitxml=.gradle/vi-reference-results.xml
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file build/credentials/plugins/verifiable-intent/qualification/vi-kotlin-immediate.json > .gradle/vi-immediate-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file build/credentials/plugins/verifiable-intent/qualification/vi-kotlin-autonomous.json > .gradle/vi-autonomous-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file build/credentials/plugins/verifiable-intent/qualification/vi-kotlin-checkout.json > .gradle/vi-checkout-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file credentials/plugins/verifiable-intent/src/test/resources/vi_python_cross_stack.json > .gradle/vi-python-immediate-results.json
          .gradle/vi-python/bin/python scripts/vi-cross-stack.py verify --reference .gradle/vi-reference --file credentials/plugins/verifiable-intent/src/test/resources/vi_python_autonomous.json > .gradle/vi-python-autonomous-results.json
          python scripts/vi-stateful-model.py --check --file credentials/plugins/verifiable-intent/src/test/resources/vi_stateful_model.json
          python scripts/check-vi-matrix.py

      - name: Reject undiscoverable tests and verify required regression evidence
        run: |
          python scripts/check-junit-contract.py --report build/reports/junit-contract.json
          python scripts/check-test-evidence.py --report build/reports/test-evidence.json
          python scripts/check-reliability-evidence.py

      - name: Validate intent host alert rules
        run: >-
          docker run --rm --network none --entrypoint promtool
          --mount "type=bind,source=${PWD}/docs/operations/intent,target=/work,readonly"
          --workdir /work prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml

      - name: Validate runtime ledger metric exposition
        run: >-
          docker run --rm -i --network none --entrypoint promtool
          prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check metrics
          < build/credentials/plugins/verifiable-intent/qualification/intent-metrics.prom

      - name: Exercise intent notification delivery and recovery
        timeout-minutes: 15
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts -p test_intent_notification_exercise.py
          python scripts/intent-notification-exercise.py

      - name: Enforce shared host coverage floors
        run: |
          ./gradlew :observability:test :observability:koverXmlReport --rerun-tasks --no-build-cache --no-daemon
          python scripts/check-coverage-policy.py build/observability/reports/kover/report.xml --policy config/host-coverage-policy.json

      - name: Validate shared host alert rules and metric exposition
        run: |
          docker run --rm --network none --entrypoint promtool --mount "type=bind,source=${PWD}/docs/operations/host,target=/work,readonly" --workdir /work prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
          docker run --rm -i --network none --entrypoint promtool prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check metrics < build/observability/qualification/host-metrics.prom

      - name: Bind validation to the candidate commit
        run: python scripts/record-validation-manifest.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            build/reports/validation-manifest.json
            build/credentials/plugins/verifiable-intent/qualification/intent-operations.json
            build/credentials/plugins/verifiable-intent/qualification/reliability/
            build/credentials/plugins/verifiable-intent/qualification/intent-metrics.prom
            build/credentials/plugins/status-list/server/qualification/status-list-diagnostics.log
            build/**/libs/*.jar
            build/**/reports/cyclonedx*/
          if-no-files-found: error

      - name: Retain validation diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-diagnostics
          include-hidden-files: true
          path: |
            .gradle/vi-*-results.json
            .gradle/vi-reference-results.xml
            build/reports/validation-manifest.json
            build/reports/vi-matrix.json
            build/reports/documentation.json
            build/reports/documentation-execution.log
            build/reports/junit-contract.json
            build/reports/test-evidence.json
            build/credentials/plugins/verifiable-intent/qualification/reliability/
            build/**/test-results/
            build/**/reports/kover/
            build/reports/intent-notifications/
            build/observability/reports/
            build/observability/qualification/
          if-no-files-found: warn

  osv-gate:
    name: OSV baseline release gate
    # The same gate security.yml runs on main (new advisories, expired triage, a broken or too-small scan), re-run
    # at the tag so a release cannot ship a dependency finding that appeared since the last main run. `publish`
    # needs this job. The scan step tolerates the scanner's non-zero exit (it exits 1 on ANY finding, and the
    # grandfathered backlog is large); the gate itself then fails on a missing/empty report or an unbaselined one.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Test the OSV tooling
        run: python3 -m unittest discover -s scripts -p 'test_check_osv_baseline.py'
      - name: Generate CycloneDX SBOMs
        run: ./gradlew cyclonedxBom --no-daemon --stacktrace
      - name: Collect the JARs behind the SBOM
        run: python scripts/collect-sbom-jars.py build/reports/cyclonedx/bom.json --output build/reports/osv/jars
      - name: Scan (JSON for the baseline gate)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --no-ignore
            --experimental-plugins=java/archive
            --format=json
            --output=build/reports/osv/osv.json
            -L=build/reports/cyclonedx/bom.json
            -r
            build/reports/osv/jars
      - name: Retain the scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-osv-scan
          path: build/reports/osv/osv.json
          if-no-files-found: warn
      - name: Fail on advisories outside the baseline or expired triage
        run: python scripts/check-osv-baseline.py --report build/reports/osv/osv.json --sbom build/reports/cyclonedx/bom.json --strict-stale

  publish:
    name: Publish signed artifacts
    needs: [evidence, osv-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Requires a reviewer on the `maven-central` environment, so a tag alone never publishes.
    environment: maven-central
    # Only this job mints OIDC tokens and writes attestations: it is the one that sees the published files.
    # `actions: read` lets it download the evidence job's manifest to compare jar hashes.
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    # Ordering is the point of this job: build once into build/release-staging, prove the jars are the ones the
    # evidence job validated, checksum, attest, and only then upload THAT directory to Central as the last step.
    # Nothing reaches Central before the checksums and attestations exist, and the attested bytes are the
    # uploaded bytes. The Central credentials are visible to the final step only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Confirm the tag matches the declared project version
        run: |
          declared="$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}' | head -1)"
          tagged="${GITHUB_REF_NAME#v}"
          test "$declared" = "$tagged" || {
            echo "Tag $GITHUB_REF_NAME does not match project version $declared" >&2
            exit 1
          }

      - name: Generate POMs and verify they satisfy Maven Central
        run: |
          ./gradlew generatePomFileForMavenPublication --no-daemon --stacktrace
          python scripts/check-publication.py

      - name: Build and sign the release into the staging repository
        # Staging only: no Central repository, no Central credentials. build/release-staging is the single
        # source of truth for everything checksummed, attested and finally uploaded.
        env:
          TRUSTWEAVE_SIGNING_KEY: ${{ secrets.TRUSTWEAVE_SIGNING_KEY }}
          TRUSTWEAVE_SIGNING_PASSWORD: ${{ secrets.TRUSTWEAVE_SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToReleaseStagingRepository --no-daemon --stacktrace

      - name: Download the validated build's manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-evidence --dir evidence
          manifest="$(find evidence -name validation-manifest.json | head -1)"
          test -n "$manifest"
          echo "VALIDATION_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Verify the staged jars are the jars the evidence job validated
        # Archives are reproducible, so a rebuild must hash identically. A mismatch means the shipped bytes are
        # not the tested bytes: stop before anything is attested or uploaded. The staged jar names must also EQUAL the
        # evidence jar names minus config/release-unpublished-jars.json, the floor derives from the manifest, and the
        # manifest head must be the tagged commit.
        run: python scripts/verify-staged-jars.py --manifest "$VALIDATION_MANIFEST" --staging build/release-staging --expected-commit "$GITHUB_SHA"

      - name: Generate the aggregate SBOM
        run: |
          ./gradlew cyclonedxBom --no-daemon --stacktrace
          test -s build/reports/cyclonedx/bom.json
          cp build/reports/cyclonedx/bom.json "build/release-staging/trustweave-${GITHUB_REF_NAME#v}-sbom.cdx.json"

      - name: Checksum the staged files
        # Every file Gradle staged (jars, POMs, module metadata, per-module CycloneDX SBOMs, .asc signatures)
        # plus the aggregate SBOM. Gradle's own .md5/.sha* sidecars and maven-metadata are excluded.
        run: |
          set -euo pipefail
          cd build/release-staging
          find . -type f ! -name 'SHA256SUMS' ! -name 'maven-metadata*' \
            ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' \
            | LC_ALL=C sort | sed 's|^\./||' | xargs sha256sum > SHA256SUMS
          count="$(wc -l < SHA256SUMS)"
          echo "Checksummed $count files"
          test "$count" -gt 0
          # actions/attest-build-provenance accepts at most 1024 subjects per attestation.
          test "$count" -le 1024 || { echo "Too many subjects ($count) for one attestation; split them" >&2; exit 1; }
          sha256sum --check --strict SHA256SUMS

      - name: Import the release public key
        # Optional until a maintainer configures it: set the repository VARIABLE TRUSTWEAVE_SIGNING_PUBLIC_KEY to the
        # ASCII-armoured PUBLIC key (never the private key) and, optionally, TRUSTWEAVE_SIGNING_FINGERPRINT to its
        # full fingerprint. No such variable existed when this step was written, so nothing is invented here.
        if: ${{ vars.TRUSTWEAVE_SIGNING_PUBLIC_KEY != '' }}
        env:
          PUBLIC_KEY: ${{ vars.TRUSTWEAVE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PUBLIC_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Warn that signatures are only checked structurally
        if: ${{ vars.TRUSTWEAVE_SIGNING_PUBLIC_KEY == '' }}
        run: echo "::warning title=Signatures not cryptographically verified::Every staged file has an .asc, but no TRUSTWEAVE_SIGNING_PUBLIC_KEY variable is configured, so gpg --verify was skipped. See docs/operations/publishing.md."

      - name: Dry-run the Central upload from the staged directory
        # Re-verifies SHA256SUMS, requires an .asc for every non-sidecar Maven file (gpg --verify against the imported
        # public key when one is configured), checks every checksum sidecar and builds the exact bundle; sends nothing.
        env:
          TRUSTWEAVE_SIGNING_FINGERPRINT: ${{ vars.TRUSTWEAVE_SIGNING_FINGERPRINT }}
          VERIFY_SIGNATURES: ${{ vars.TRUSTWEAVE_SIGNING_PUBLIC_KEY != '' }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$VERIFY_SIGNATURES" = "true" ]; then flags+=(--verify-signatures); fi
          python scripts/upload-to-central.py --staging build/release-staging --name "trustweave-${GITHUB_REF_NAME#v}" --dry-run "${flags[@]}"

      - name: Attest SLSA build provenance for every staged file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: build/release-staging/SHA256SUMS

      - name: Attest the checksum file itself
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release-staging/SHA256SUMS

      - name: Record the staged POMs
        run: |
          ./gradlew -q :distribution:bom:generatePomFileForMavenPublication --no-daemon
          ls -R build/*/publications > published-poms.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-poms
          path: published-poms.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: build/release-staging/
          if-no-files-found: error

      - name: Re-verify the attestation and the staged bytes just before the upload
        # Proves, right before the credentials are used, that SHA256SUMS is the file this workflow attested (signer
        # workflow, tag ref and commit) and that every staged file still hashes to it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify build/release-staging/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
          (cd build/release-staging && sha256sum --check --strict SHA256SUMS)

      - name: Upload the attested staging directory to Maven Central
        # LAST step. Re-verifies SHA256SUMS, then uploads exactly build/release-staging (nothing is rebuilt).
        # USER_MANAGED: the deployment waits in the Central Portal for a person to release it.
        env:
          TRUSTWEAVE_PUBLISH_USERNAME: ${{ secrets.TRUSTWEAVE_PUBLISH_USERNAME }}
          TRUSTWEAVE_PUBLISH_PASSWORD: ${{ secrets.TRUSTWEAVE_PUBLISH_PASSWORD }}
        run: python scripts/upload-to-central.py --staging build/release-staging --name "trustweave-${GITHUB_REF_NAME#v}"

  release-assets:
    name: Stage checksums on a draft GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the checksums and aggregate SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-artifacts --dir release-artifacts
          test -s release-artifacts/SHA256SUMS
      - name: Stage the assets on a DRAFT release for this tag
        # The Central deployment is USER_MANAGED: it only exists as a pending deployment until a person releases it
        # in the Portal, and this job cannot ask Central whether that happened (that needs a real API call with
        # the publish credentials, which only the upload step may see). So the GitHub release stays a DRAFT here:
        # nothing is announced for a version that may never reach Central. A maintainer publishes the draft after
        # the Portal shows the deployment as PUBLISHED (docs/operations/publishing.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(release-artifacts/SHA256SUMS "release-artifacts/trustweave-${GITHUB_REF_NAME#v}-sbom.cdx.json")
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[] | select(.tagName == env.GITHUB_REF_NAME) | .tagName')"
          if [ -n "$existing" ]; then
            echo "A release for $GITHUB_REF_NAME already exists; adding the assets without changing its state."
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --generate-notes "${assets[@]}"
          fi
