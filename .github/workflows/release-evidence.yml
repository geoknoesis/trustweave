name: Release evidence

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TRUSTWEAVE_INDY_INTEGRATION: required

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Validate release and generate dependency inventories
        run: ./gradlew build checkKotlinAbi cyclonedxBom --no-daemon --stacktrace
      - name: Attest build outputs
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            build/**/libs/*.jar
            build/reports/cyclonedx/bom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            build/**/libs/*.jar
            build/**/reports/cyclonedx*/
          if-no-files-found: error
