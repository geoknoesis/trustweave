name: TrustWeaveWallet
options:
  bundleIdPrefix: org.trustweave
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TrustWeaveWallet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrustWeaveWallet
        excludes:
          - Info.plist
          - TrustWeaveWallet.entitlements
    info:
      path: TrustWeaveWallet/Info.plist
    entitlements:
      path: TrustWeaveWallet/TrustWeaveWallet.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trustweave.referencewallet
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_EMIT_LOC_STRINGS: YES
  TrustWeaveWalletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/TrustWeaveWalletTests
    dependencies:
      - target: TrustWeaveWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trustweave.referencewallet.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrustWeaveWallet:
    build:
      targets:
        TrustWeaveWallet: all
        TrustWeaveWalletTests: [test]
    test:
      targets:
        - TrustWeaveWalletTests
